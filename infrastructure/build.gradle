plugins {
    id 'java-conventions'
    id 'application'
    alias(libs.plugins.spring.boot)
}

bootJar {
    archiveFileName = 'application.jar'
    destinationDirectory = file("${rootProject.buildDir}/libs")
}

def gav = { group, name, versionRef ->
    "${group}:${name}:${versionRef.get()}"
}

dependencies {

    implementation(project(':domain'))
    implementation(project(':application'))

    implementation platform(gav('org.springframework.boot', 'spring-boot-dependencies', libs.versions.spring.boot))
    implementation platform('org.springframework.cloud:spring-cloud-dependencies:2025.1.1')

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.postgresql:postgresql:42.7.10'
    implementation 'com.h2database:h2:2.4.240'

    implementation 'org.springframework.cloud:spring-cloud-stream'
    implementation 'org.springframework.cloud:spring-cloud-starter-stream-rabbit'

    implementation 'org.aspectj:aspectjrt:1.9.25.1'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'

    implementation 'commons-io:commons-io:2.21.0'
    implementation 'commons-codec:commons-codec:1.20.0'

}
