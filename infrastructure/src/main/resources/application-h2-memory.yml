spring:
  h2:
    console:
      enabled: ${h2.console.enabled}
      path: ${h2.console.path}

database:
  driver: org.h2.Driver
  username: ${h2.username}
  password: ${h2.password}
  url: jdbc:h2:mem:${h2.database.name};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
  hibernate:
    ddl-auto: ${HIBERNATE_DDL_AUTO:none}
  show-sql: ${SHOW_SQL:false}

h2:
  username: ${H2_USERNAME:sa}
  password: ${H2_PASSWORD:sa}
  console:
    enabled: ${H2_CONSOLE_ENABLED:true}
    path: ${H2_CONSOLE_PATH:/h2-console}
  database: 
    name: ${H2_DATABASE:storage}
  