spring:
  cloud:
    stream:
      binders:
        private-binder:
          type: rabbit
          environment:
            spring:
              rabbitmq:
                host: ${rabbitmq.host}
                port: ${rabbitmq.port}
                virtual-host: ${rabbitmq.private-virtual-host}
                username: ${rabbitmq.username}
                password: ${rabbitmq.password}
        public-binder:
          type: rabbit
          environment:
            spring:
              rabbitmq:
                host: ${rabbitmq.host}
                port: ${rabbitmq.port}
                virtual-host: ${rabbitmq.public-virtual-host}
                username: ${rabbitmq.username}
                password: ${rabbitmq.password}
      default-binder: private-binder
      rabbit:
        bindings:
          ###### -------- DOMAIN EVENTS -------- ######
          ## --------------------------------------- ##

          ###### ------ PRIVATE MESSAGES ------- ######
          ## Create File --------------------------- ##
          # Outgoing -> Create File                   #
          createFileCommand-out-0:
            producer:
              exchangeType: topic
              routingKeyExpression: "'create-file'"
          # Outgoing -> Create File (error)           #
          createFileCommandError-out-0:
            producer:
              exchangeType: topic
              routingKeyExpression: "'create-file'"
              queueNameGroupOnly: true
          # Incoming <- Create File                   #
          createFileCommand-in-0:
            consumer:
              exchangeType: topic
              bindingRoutingKey: create-file
              queueNameGroupOnly: true
              autoBindDlq: true
              deadLetterExchange: command.exchange.wait
              deadLetterQueueName: command:create-file.queue.wait
              dlqDeadLetterExchange: command.exchange
              dlqDeadLetterRoutingKey: create-file
              republishToDlq: false
              dlqTtl: 1000

          ## Publish File -------------------------- ##
          # Outgoing -> Publish File                  #
          publishFileCommand-out-0:
            producer:
              exchangeType: topic
              routingKeyExpression: "'publish-file'"
          # Outgoing -> Publish File (error)           #
          publishFileCommandError-out-0:
            producer:
              exchangeType: topic
              routingKeyExpression: "'publish-file'"
              queueNameGroupOnly: true
          # Incoming <- Publish File                   #
          publishFileCommand-in-0:
            consumer:
              exchangeType: topic
              bindingRoutingKey: publish-file
              queueNameGroupOnly: true
              autoBindDlq: true
              deadLetterExchange: command.exchange.wait
              deadLetterQueueName: command:publish-file.queue.wait
              dlqDeadLetterExchange: command.exchange
              dlqDeadLetterRoutingKey: publish-file
              republishToDlq: false
              dlqTtl: 1000
          ## --------------------------------------- ##

          ###### ------- PUBLIC MESSAGES ------- ######
          ## File Created Integration -------------- ##
          # Incoming <- File Created Integration      #
          fileCreatedIntegration-in-0:
            consumer:
              exchangeType: topic
              bindingRoutingKey: drive.file.created
              queueNameGroupOnly: true
              autoBindDlq: true
              deadLetterExchange: storage.exchange.wait
              deadLetterQueueName: storage.drive.file.created.queue.wait
              dlqDeadLetterExchange: storage.exchange
              dlqDeadLetterRoutingKey: drive.file.created
              republishToDlq: false
              dlqTtl: 1000
          ## ------------------------------------------ ##
          # Outgoing -> File Created Integration (error) #
          fileCreatedIntegrationError-out-0:
            producer:
              exchangeType: topic
              routingKeyExpression: "'drive.file.created'"
              queueNameGroupOnly: true
          ## File Created Integration (retry) ------ ##
          # Incoming <- File Created Integration      #
          fileCreatedIntegrationRetry-in-0:
            consumer:
              exchangeType: topic
              bindingRoutingKey: drive.file.created
              queueNameGroupOnly: true
              autoBindDlq: true
              deadLetterExchange: storage.exchange.wait
              deadLetterQueueName: storage.drive.file.created.queue.wait
              dlqDeadLetterExchange: storage.exchange
              dlqDeadLetterRoutingKey: drive.file.created
              republishToDlq: false
              dlqTtl: 1000
          ## --------------------------------------- ##
          ## File Publication Initiated Integration -------------- ##
          # Incoming <- File Publication Initiated Integration      #
          filePublicationInitiatedIntegration-in-0:
            consumer:
              exchangeType: topic
              bindingRoutingKey: drive.file:publication.initiated
              queueNameGroupOnly: true
              autoBindDlq: true
              deadLetterExchange: storage.exchange.wait
              deadLetterQueueName: storage.drive.file:publication.initiated.queue.wait
              dlqDeadLetterExchange: storage.exchange
              dlqDeadLetterRoutingKey: drive.file:publication.initiated
              republishToDlq: false
              dlqTtl: 1000
          ## ------------------------------------------ ##
          # Outgoing -> File Publication Initiated Integration (error) #
          filePublicationInitiatedIntegrationError-out-0:
            producer:
              exchangeType: topic
              routingKeyExpression: "'drive.file:publication.initiated'"
              queueNameGroupOnly: true
          ## File Publication Initiated Integration (retry) ------ ##
          # Incoming <- File Publication Initiated Integration      #
          filePublicationInitiatedIntegrationRetry-in-0:
            consumer:
              exchangeType: topic
              bindingRoutingKey: drive.file:publication.initiated
              queueNameGroupOnly: true
              autoBindDlq: true
              deadLetterExchange: storage.exchange.wait
              deadLetterQueueName: storage.drive.file:publication.initiated.queue.wait
              dlqDeadLetterExchange: storage.exchange
              dlqDeadLetterRoutingKey: drive.file:publication.initiated
              republishToDlq: false
              dlqTtl: 1000
          ## --------------------------------------- ##

rabbitmq:
  host: ${RABBITMQ_HOST:localhost}
  port: ${RABBITMQ_PORT:5672}
  private-virtual-host: ${RABBITMQ_PRIVATE_VIRTUAL_HOST:/}
  public-virtual-host: ${RABBITMQ_PUBLIC_VIRTUAL_HOST:/}
  username: ${RABBITMQ_USERNAME:rabbitmq}
  password: ${RABBITMQ_PASSWORD:rabbitmq}
